<!doctype html>
<html lang="ckb" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ebebeb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="کەشوهەوا">
<title>کەشوهەوا — کوردستان</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
/* فۆنتی Vazirmatn: ئەگەر فایلی fonts/Vazirmatn-Variable.woff2 دانرابێت بێ ئینتەرنێتیش کار دەکات */
@font-face{font-family:'VazirLocal';src:url('fonts/Vazirmatn-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#ebebeb;--fg:#222;--mute:#8a8a8a;--line:#d6d6d6;--card:#e0e0e0;--accent:#222}
[data-theme=dark]{--bg:#222;--fg:#f2f2f2;--mute:#8b8b8b;--line:#3a3a3a;--card:#2e2e2e;--accent:#f2f2f2}
/* ڕەنگی وەرزەکان */
[data-pal=spring]{--bg:#e9f0e4;--fg:#1f2d1c;--mute:#7f8f7a;--line:#d0dccb;--card:#dde8d6;--accent:#3f8f3a}
[data-pal=spring][data-theme=dark]{--bg:#1b241a;--fg:#eaf3e6;--mute:#8a9b86;--line:#2f3d2d;--card:#25301f;--accent:#7cc66f}
[data-pal=summer]{--bg:#f6ecd8;--fg:#2b2112;--mute:#9a8a6c;--line:#e4d5b6;--card:#eddfc2;--accent:#e08a00}
[data-pal=summer][data-theme=dark]{--bg:#261f12;--fg:#f6ecd8;--mute:#a09070;--line:#3d3320;--card:#31291a;--accent:#ffb02e}
[data-pal=autumn]{--bg:#f0e3d8;--fg:#2c1d14;--mute:#988070;--line:#dcc8b8;--card:#e6d3c4;--accent:#c4511a}
[data-pal=autumn][data-theme=dark]{--bg:#251a14;--fg:#f2e4d9;--mute:#9e8878;--line:#3c2b21;--card:#30221b;--accent:#f08a4b}
[data-pal=winter]{--bg:#e6edf3;--fg:#17222c;--mute:#7b8b99;--line:#cfdbe5;--card:#d9e4ed;--accent:#2d6fa8}
[data-pal=winter][data-theme=dark]{--bg:#161e26;--fg:#e8f0f6;--mute:#8497a6;--line:#2a3744;--card:#212c37;--accent:#6bb2ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'VazirLocal','Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;transition:background .3s,color .3s}
button,input{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 22px) 26px calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;transition:opacity .25s}
.app.loading{opacity:.35}
header{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:1.2rem;font-weight:700;margin:0;line-height:1.4}
.date{color:var(--mute);font-size:.82rem}
.actions{display:flex;gap:0;margin-inline-end:-8px}
button.icon{background:none;border:0;color:var(--fg);padding:8px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
button.icon svg{width:24px;height:24px}
/* پلەی گەرما لە ناوەڕاست */
.temp{direction:ltr;text-align:center;font-size:min(36vw,10.5rem);font-weight:800;line-height:1.05;letter-spacing:-.05em;margin:30px 0 0;color:var(--accent);transition:color .3s}
.temp .deg{font-weight:800}
.cond{text-align:center;color:var(--mute);font-size:.95rem;margin:4px 0 0}
.cond b{color:var(--fg);font-weight:600}
.hours{display:flex;gap:16px;overflow-x:auto;padding:26px 0 8px;scrollbar-width:none;margin-top:6px}
.hours::-webkit-scrollbar{display:none}
.h{flex:0 0 auto;min-width:46px;text-align:center;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.h .t{color:var(--mute)}
.h b{font-weight:700;font-size:.82rem;direction:ltr;unicode-bidi:isolate}
.h svg{width:28px;height:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 16px;margin-top:26px}
.grid .l{color:var(--mute);font-size:.85rem}
.grid .v{font-size:1.05rem;font-weight:600;margin-top:2px}
.grid .v small{display:block;font-size:.7rem;color:var(--mute);font-weight:400}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.days{display:flex;gap:20px;margin-top:auto;padding-top:34px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;font-size:.68rem;text-align:center}
.d .w{color:var(--fg);font-weight:600;font-size:.74rem;margin-bottom:2px;white-space:nowrap}
.d .t{color:var(--mute);white-space:nowrap}
.d b{display:block;font-weight:700;font-size:.78rem;margin-top:3px;direction:ltr}
.err{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--card);font-size:.85rem}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 30px)}
.srow{display:flex;gap:8px;align-items:center}
.srow input{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--fg);background:var(--card);border:0;border-radius:14px;padding:13px 16px;outline:none}
.srow input::placeholder{color:var(--mute)}
.st{flex:1;margin:0;font-size:1.1rem;font-weight:700}
.res{margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:13px 2px;font-size:.98rem;cursor:pointer}
.item small{color:var(--mute);font-size:.75rem}
.gt{margin:26px 0 10px;font-size:.78rem;color:var(--mute)}
.chips,.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);color:var(--fg);border:0;border-radius:999px;padding:8px 15px;font-size:.88rem;cursor:pointer}
.opt{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--fg);border:1.5px solid transparent;border-radius:999px;padding:9px 16px;font-size:.9rem;cursor:pointer;transition:border-color .2s}
.opt.on{border-color:var(--accent)}
.opt i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip:active,.item:active,.opt:active{opacity:.6}
.empty{color:var(--mute);font-size:.85rem;padding:14px 2px}
</style>
</head>

  <div class="temp" id="temp">—</div>
  <div class="cond" id="cond">&nbsp;</div>
  <div class="err" id="err" data-i="err" hidden></div>

  <div class="hours" id="hours"></div>

  <div class="grid">
    <div><div class="l" data-i="sunrise"></div><div class="v" id="sunrise">—</div></div>
    <div><div class="l" data-i="sunset"></div><div class="v" id="sunset">—</div></div>
    <div><div class="l" data-i="feels"></div><div class="v" id="feels">—</div></div>
    <div><div class="l" data-i="wind"></div><div class="v" id="wind">—</div></div>
    <div><div class="l" data-i="hum"></div><div class="v" id="hum">—</div></div>
    <div><div class="l" data-i="pres"></div><div class="v" id="pres">—</div></div>
    <div><div class="l" data-i="vis"></div><div class="v" id="vis">—</div></div>
    <div><div class="l" data-i="uv"></div><div class="v" id="uv">—</div></div>
  </div>

  <div class="days" id="days"></div>
</div>

<!-- گەڕان -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="in">
    <div class="srow">
      <input id="q" type="search" data-ip="searchPh" autocomplete="off" enterkeyhint="search">
      <button class="icon" id="btnLoc" data-ia="myLoc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
      <button class="icon" id="btnClose" data-ia="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="res" id="res"></div>
    <div id="groups"></div>
  </div>
</div>

<!-- ڕێکخستنەکان -->
<div class="sheet" id="settings" aria-hidden="true">
  <div class="in">
    <div class="srow">
      <h2 class="st" data-i="settings"></h2>
      <button class="icon" id="btnCloseSet" data-ia="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="gt" data-i="lang"></div>
    <div class="opts" id="setLang"></div>
    <div class="gt" data-i="look"></div>
    <div class="opts" id="setMode"></div>
    <div class="gt" data-i="pal"></div>
    <div class="opts" id="setPal"></div>
    <div class="gt" data-i="cal"></div>
    <div class="opts" id="setCal"></div>
  </div>
</div>

function toJalali(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function hijriCalc(y,m,d){
  const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  const jd=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  let l=jd-1948440+10632;const n=Math.floor((l-1)/10631);l=l-10631*n+354;
  const j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
  l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
  const hm=Math.floor(24*l/709);
  return [30*n+j-30,hm,l-Math.floor(709*hm/24)];
}
function toHijri(y,m,d){
  try{
    const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'}).formatToParts(new Date(Date.UTC(y,m-1,d,12)));
    const g=k=>parseInt(p.find(x=>x.type===k).value,10);
    const r=[g('year'),g('month'),g('day')];
    if(r.every(v=>v>0))return r;
  }catch(e){}
  return hijriCalc(y,m,d);
}
function fmtDate(y,m,d){
  const M=Lg.months;
  if(S.cal==='greg')return {y:y,m:M.greg[m-1],d:d};
  if(S.cal==='hijri'){const h=toHijri(y,m,d);return {y:h[0],m:M.hijri[h[1]-1],d:h[2]}}
  const j=toJalali(y,m,d);return {y:j[0],m:M.solar[j[1]-1],d:j[2]};
}
function season(){
  const n=new Date(),j=toJalali(n.getFullYear(),n.getMonth()+1,n.getDate())[1];
  return j<=3?'spring':j<=6?'summer':j<=9?'autumn':'winter';
}

const smallCloud='<g transform="translate(1.2,-1) scale(.82)">'+CLOUD+'</g>';
function icon(kind,day){
  let b='';
  switch(kind){
    case 'clear': b=day?SUN:MOON;break;
    case 'partly': b=day?'<g transform="translate(9,-1) scale(.5)">'+SUN+'</g><g transform="translate(0,3) scale(.82)">'+CLOUD+'</g>':'<g transform="translate(10,0) scale(.5)">'+MOON+'</g><g transform="translate(0,3) scale(.82)">'+CLOUD+'</g>';break;
    case 'cloud': b=CLOUD;break;
    case 'fog': b='<path d="M4 8h16M6 12h12M4 16h16M7 20h10"/>';break;
    case 'rain': b=smallCloud+'<path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>';break;
    case 'snow': b=smallCloud+'<path d="M8 18.5v.01M12 20.5v.01M16 18.5v.01M10 22v.01M14 22v.01" stroke-width="2.4"/>';break;
    case 'storm': b=smallCloud+'<path d="M12.5 14l-2.5 4h3.2l-1.7 4"/>';break;
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">'+b+'</svg>';
}
function kindOf(c){
  if(c<=1)return 'clear'; if(c===2)return 'partly'; if(c===3)return 'cloud';
  if(c===45||c===48)return 'fog';
  if((c>=51&&c<=67)||(c>=80&&c<=82))return 'rain';
  if((c>=71&&c<=77)||c===85||c===86)return 'snow';
  if(c>=95)return 'storm'; return 'cloud';
}

async function load(city){
  cur=city;store.set('city',city);showCity();
  const app=$('#app');app.classList.add('loading');$('#err').hidden=true;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+city.lat+'&longitude='+city.lon+
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m'+
      '&hourly=temperature_2m,weather_code,is_day,visibility'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max'+
      '&timezone=auto&forecast_days=11&wind_speed_unit=kmh';
    const r=await fetch(u);if(!r.ok)throw 0;
    draw(await r.json());
  }catch(e){$('#err').hidden=false}
  app.classList.remove('loading');
}
function draw(d){
  lastData=d;
  const c=d.current,hr=d.hourly,dl=d.daily;
  const [y,m,dd]=c.time.slice(0,10).split('-').map(Number);
  const fh=fmtDate(y,m,dd);
  $('#date').textContent=fd(fh.d)+' '+fh.m+' '+fd(fh.y);
  const wd=Lg.days[new Date(y,m-1,dd).getDay()];
  $('#temp').innerHTML=T(c.temperature_2m)+'<span class="deg">°</span>';
  $('#cond').innerHTML='<b>'+wd+'</b> · '+Lg.cond[kindOf(c.weather_code)];
  let i0=hr.time.findIndex(x=>x.startsWith(c.time.slice(0,13)));if(i0<0)i0=0;
  let h='';
  for(let k=0;k<24&&i0+k<hr.time.length;k++){
    const i=i0+k,code=k===0?c.weather_code:hr.weather_code[i],day=k===0?c.is_day:hr.is_day[i];
    h+='<div class="h"><span class="t">'+(k===0?t('now'):fd(hr.time[i].slice(11,16)))+'</span>'+icon(kindOf(code),day)+'<b>'+T(hr.temperature_2m[i])+'°</b></div>';
  }
  $('#hours').innerHTML=h;
  $('#sunrise').innerHTML='<span class="ltr">'+fd(dl.sunrise[0].slice(11,16))+'</span>';
  $('#sunset').innerHTML='<span class="ltr">'+fd(dl.sunset[0].slice(11,16))+'</span>';
  $('#feels').innerHTML='<span class="ltr">'+T(c.apparent_temperature)+'°</span>';
  $('#wind').innerHTML='<span class="ltr">'+fd(Math.round(c.wind_speed_10m))+' km/h</span><small>'+Lg.dirs[Math.round(c.wind_direction_10m/45)%8]+'</small>';
  $('#hum').textContent=fd(Math.round(c.relative_humidity_2m))+Lg.pct;
  $('#pres').innerHTML='<span class="ltr">'+fd(Math.round(c.surface_pressure))+' hPa</span>';
  const vis=hr.visibility&&hr.visibility[i0]!=null?Math.round(hr.visibility[i0]/1000):null;
  $('#vis').innerHTML=vis==null?'—':'<span class="ltr">'+fd(vis)+' km</span>';
  const uv=Math.round(dl.uv_index_max[0]||0);
  $('#uv').textContent=fd(uv)+' '+uvLabel(uv);
  let ds='';
  for(let i=1;i<dl.time.length&&i<=10;i++){
    const [yy,mm,d2]=dl.time[i].split('-').map(Number);
    const f=fmtDate(yy,mm,d2);
    ds+='<div class="d"><div class="w">'+Lg.days[new Date(yy,mm-1,d2).getDay()]+'</div><div class="t">'+fd(f.d)+' '+f.m+'</div><b>'+T(dl.temperature_2m_min[i])+'°/'+T(dl.temperature_2m_max[i])+'°</b></div>';
  }
  $('#days').innerHTML=ds;
}

    const n=NAMES[p.en]||[];
    return [p.n,p.en,n[0]||'',n[1]||''].some(x=>norm(x).includes(nv));
  }).map(p=>({city:pc(p),label:cityName(p),sub:Lg.groups[p.g][1],lat:p.lat,lon:p.lon}));
  showResults(local);
  if(v.length<2)return;
  const my=++seq;
  timer=setTimeout(async()=>{
    try{
      const lg=S.lang==='ku'?'en':S.lang;
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(v)+'&count=20&language='+lg+'&format=json');
      const d=await r.json();
      if(my!==seq)return;
      const extra=(d.results||[]).filter(x=>CC[x.country_code]).filter(x=>!local.some(l=>Math.abs(l.lat-x.latitude)<.15&&Math.abs(l.lon-x.longitude)<.15))
        .map(x=>({city:{n:x.name,lat:x.latitude,lon:x.longitude},label:x.name,sub:[x.admin1,Lg.groups[CC[x.country_code]][1]].filter(Boolean).join(S.lang==='en'?', ':'، ')}));
      showResults(local.concat(extra),t('noRes'));
    }catch(e){if(my===seq)showResults(local,local.length?'':t('err'))}
  },350);
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&found.length)pick(found[0].city)});

/* ================= زمان ================= */
function applyLang(){
  Lg=LANGS[S.lang];
  const r=document.documentElement;
  r.lang=Lg.code;r.dir=Lg.dir;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ia)));
  res.innerHTML='';q.value='';
  buildGroups();renderSettings();showCity();
  if(lastData)draw(lastData);
}

applyLook();
applyLang();
load(cur);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
